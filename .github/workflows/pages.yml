name: Pages

# Builds the documentation (docs/, mkdocs.yml) and publishes it on this repository's GitHub
# Pages when a change to the pages reaches main. --strict stops the build on a broken link
# or a page missing from the navigation, so a mistake never reaches the published site.
# GitHub Pages itself is switched on in the repository settings (Pages -> Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/docs_hooks.py"
      - "src/reprintbuddy/__init__.py" # the version inside the installation command
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MkDocs and its plugins
        run: python -m pip install ".[docs]"
      - name: Build
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
