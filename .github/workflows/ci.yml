name: CI

# A run started by hand is named after its branch and purpose, e.g. "CI release/v0.4.6 (before release)".
# Every other event gets a single space: GitHub treats a whitespace-only run-name like a missing one and
# uses the event's own title (the commit message of a push, the title of a pull request).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI {0} ({1})', github.ref_name, inputs.purpose) || ' ' }}

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      purpose:
        description: Why this run is started (shown in the name of the run)
        required: false
        default: before release

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q --durations=25

  install-script:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and ShellCheck
        run: |
          if [ ! -f install/install.sh ]; then
            echo "No install script in this revision."
            exit 0
          fi
          bash -n install/install.sh
          shellcheck install/install.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MkDocs and its plugins
        run: python -m pip install ".[docs]"
      - name: Build the pages (a broken link or a page missing from the navigation fails)
        run: mkdocs build --strict
