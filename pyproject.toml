[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reprintbuddy"
dynamic = ["version"]
description = "Stock keeping for 3D-printed items, with reprints through Bambuddy's queue."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "PyYAML>=6",
]

[project.scripts]
reprintbuddy = "reprintbuddy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reprintbuddy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reprintbuddy = [
    "web/templates/**/*",
    "web/static/**/*",
    "locales/*.json",
    "migrations/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette's TestClient prefers httpx2; this project keeps plain httpx.
    "ignore:Using .httpx. with .starlette.testclient.",
]
