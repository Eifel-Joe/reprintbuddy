{% extends "base.html" %}
{% block title %}{{ t('orders.cancel') }}{% endblock %}
{% block content %}
<h1>{{ order.reference }}</h1>
<section class="card section">
  <p>{{ t('orders.cancel_confirm', reference=order.reference) }}</p>
  <form method="post" action="/orders/{{ order.id }}/cancel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="form_token" value="{{ form_token_value }}">
    <input type="hidden" name="confirm" value="yes">
    <label>{{ t('journal.field.note') }} <input name="note" value="{{ note }}" maxlength="500"></label>
    <button class="btn" type="submit">{{ t('orders.cancel_yes') }}</button>
    <a class="btn-link" href="/orders/{{ order.id }}">{{ t('orders.cancel_keep') }}</a>
  </form>
</section>
{% endblock %}
