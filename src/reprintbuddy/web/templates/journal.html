{% extends "base.html" %}
{% block title %}{{ t('journal.title') }}{% endblock %}
{% block content %}
<h1>{{ t('journal.title') }}</h1>
{% include "_journal_table.html" %}
<p>
  {% if has_prev %}<a class="btn-link" href="{{ prev_url }}">{{ t('journal.newer') }}</a>{% endif %}
  {% if has_next %}<a class="btn-link" href="{{ next_url }}">{{ t('journal.older') }}</a>{% endif %}
</p>
{% endblock %}
