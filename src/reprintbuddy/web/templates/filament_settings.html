{% extends "base.html" %}
{% import "_ui.html" as ui with context %}
{% block title %}{{ label }}{% endblock %}
{% block content %}
{% call ui.page_head("disc-3", label) %}{% endcall %}
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<section class="card section">
  <form method="post" action="/filament/{{ sort_id }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row">
      <label>{{ t('filament.field.lead_time_days') }}
        <input name="lead_time_days" inputmode="numeric" value="{{ values.lead_time_days }}">
      </label>
      <label>{{ t('filament.field.pack_grams') }}
        <input name="pack_grams" inputmode="numeric" value="{{ values.pack_grams }}">
      </label>
    </div>
    <div class="row">
      <label>{{ t('filament.field.safety_value') }}
        <input name="safety_value" inputmode="numeric" value="{{ values.safety_value }}">
      </label>
      <label>{{ t('filament.field.safety_unit') }}
        <select name="safety_unit">
          <option value="days"{% if values.safety_unit == 'days' %} selected{% endif %}>{{ t('filament.safety_unit.days') }}</option>
          <option value="grams"{% if values.safety_unit == 'grams' %} selected{% endif %}>{{ t('filament.safety_unit.grams') }}</option>
        </select>
      </label>
    </div>
    <label>{{ t('filament.field.min_order_packs') }}
      <input name="min_order_packs" inputmode="numeric" value="{{ values.min_order_packs }}">
    </label>
    <label>{{ t('filament.field.supplier') }}
      <input name="supplier" value="{{ values.supplier }}" maxlength="200">
    </label>
    <label>{{ t('filament.field.order_url') }}
      <input name="order_url" value="{{ values.order_url }}" maxlength="2000" inputmode="url">
    </label>
    <button class="btn" type="submit">{{ t('common.save') }}</button>
    <a class="btn-link" href="/filament">{{ t('common.cancel') }}</a>
  </form>
</section>
{% endblock %}
